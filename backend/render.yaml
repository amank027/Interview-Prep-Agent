services:
  - type: web
    name: interview-prep-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: MAX_CHUNK_SIZE
        value: 500
      - key: CHUNK_OVERLAP
        value: 50
      - key: RETRIEVAL_TOP_K
        value: 5
      - key: CORS_ORIGINS
        value: '["*"]'
